<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ece3ce" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Public+Sans:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Lemmary</title>
    <!-- Mirrors initTheme in src/lib/theme.ts. Runs before the stylesheet paints so a dark theme never flashes the light ground first. -->
    <script>
      try {
        var palettes = { paper: ['paper', 'ink'], neutral: ['daylight', 'carbon'], nord: ['snowstorm', 'nord'], catppuccin: ['latte', 'mocha'], rosepine: ['dawn', 'rosepine'], monokai: ['monokai-light', 'monokai'] }
        var stored = localStorage.getItem('lemmary_theme')
        var family = Object.hasOwn(palettes, stored) ? palettes[stored] : palettes.paper
        var mode = localStorage.getItem('lemmary_mode')
        var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = family[dark ? 1 : 0]
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
